<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="desktop">
  <div id="iconField"></div>

  <section class="window" id="win-welcome" data-title="Welcome">
    <header class="windowheader"><span class="wintitle">Welcome</span></header>
    <div class="winbody welcome-body">
      <div class="brandglyph"></div>
      <h1>Flow OS</h1>
      <p class="tagline">Windows 10 discipline, hacker temperament.</p>
      <hr>
      <p class="bio">
        I'm <mark class="placeholder">[your name]</mark> —
        <mark class="placeholder">[one-line bio goes here]</mark>.
        This desktop is where I keep the tools I actually use.
      </p>
      <p class="links">
        <a class="placeholder" href="#">[github]</a>
        <a class="placeholder" href="#">[twitter]</a>
        <a class="placeholder" href="#">[site]</a>
      </p>
    </div>
  </section>

  <section class="window" id="win-cipher" data-title="Cipher Lab">
    <header class="windowheader"><span class="wintitle">Cipher Lab</span></header>
    <div class="winbody cipher-layout">
      <nav id="cipherList" aria-label="Ciphers"></nav>
      <div class="cipher-pane">
        <h2 id="cipherName"></h2>
        <label for="cipherInput">input</label>
        <textarea id="cipherInput" spellcheck="false" placeholder="type something"></textarea>
        <div class="cipher-actions">
          <button id="cipherEncode" class="ctabtn">Encode</button>
          <button id="cipherDecode" class="ctabtn">Decode</button>
        </div>
        <label for="cipherOutput">output</label>
        <textarea id="cipherOutput" spellcheck="false" readonly placeholder="result"></textarea>
      </div>
    </div>
  </section>

  <section class="window" id="win-sysmon" data-title="System Monitor">
    <header class="windowheader"><span class="wintitle">System Monitor</span></header>
    <div class="winbody sysmon-body">
      <div class="gauge">
        <label>CPU <span id="cpuValue"></span></label>
        <canvas id="cpuCanvas"></canvas>
      </div>
      <div class="gauge">
        <label>NET <span id="netValue"></span></label>
        <canvas id="netCanvas"></canvas>
      </div>
      <p class="sysmon-note">every number here is simulated — this window is decoration.</p>
    </div>
  </section>

  <section class="window" id="win-terminal" data-title="rootshell">
    <header class="windowheader"><span class="wintitle">rootshell</span></header>
    <div class="winbody term-body">
      <div id="termScreen"></div>
    </div>
  </section>

  <div id="startMenu" hidden>
    <div id="startApps"></div>
    <button id="switchUser"></button>
  </div>

  <footer id="taskbar">
    <button id="startButton" aria-label="Start"></button>
    <div id="taskItems"></div>
    <div id="tray"><span id="timeElement"></span></div>
  </footer>

  <canvas id="matrixCanvas"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
