    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tasks-bg)" filter="url(#mac-sh)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <!-- Colored Dot 1: Blue -->
  <circle cx="32" cy="38" r="10" fill="#007aff"/>
