<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="set-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e8e93"/>
      <stop offset="100%" stop-color="#636366"/>
    </linearGradient>
    <filter id="mac-sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#set-bg)" filter="url(#mac-sh)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
  <!-- Central Gear -->
  <circle cx="64" cy="64" r="30" fill="#d1d1d6"/>
  <circle cx="64" cy="64" r="14" fill="#636366"/>
  <!-- Gear Teeth -->
  <g fill="#d1d1d6">
    <rect x="58" y="24" width="12" height="12" rx="3"/>
    <rect x="58" y="92" width="12" height="12" rx="3"/>
    <rect x="24" y="58" width="12" height="12" rx="3"/>
    <rect x="92" y="58" width="12" height="12" rx="3"/>
    <rect x="34" y="34" width="12" height="12" rx="3" transform="rotate(45 40 40)"/>
    <rect x="82" y="82" width="12" height="12" rx="3" transform="rotate(45 88 88)"/>
    <rect x="34" y="82" width="12" height="12" rx="3" transform="rotate(-45 40 88)"/>
    <rect x="82" y="34" width="12" height="12" rx="3" transform="rotate(-45 88 40)"/>
  </g>
</svg>